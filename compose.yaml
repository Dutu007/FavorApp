name: favor-app

services:
  api:
    image: ghcr.io/dutu007/favorapp-api:${IMAGE_TAG:-latest}
    mem_limit: 128m
    mem_reservation: 64m
    restart: unless-stopped
    environment:
      DATABASE_HOST: shared-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LISTEN_ADDR: :8080
    volumes:
      - ./apks:/data/apks:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      database:
      edge:
        aliases:
          - favorapp-api

networks:
  database:
    external: true
    name: shared-db
  edge:
    external: true
    name: zengdeming-edge
