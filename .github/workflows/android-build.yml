name: Build Android app

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "local.properties.example"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure API client
        run: |
          cat > local.properties <<EOF
          api.baseUrl=https://api.zengdeming.cn
          EOF

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FavorApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore release keystore
        if: ${{ secrets.FAVORAPP_KEYSTORE_BASE64 != '' }}
        env:
          FAVORAPP_KEYSTORE_BASE64: ${{ secrets.FAVORAPP_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$FAVORAPP_KEYSTORE_BASE64" | base64 -d > keystore/favorapp-release.jks

      - name: Assemble release APK
        if: ${{ secrets.FAVORAPP_KEYSTORE_BASE64 != '' }}
        env:
          FAVORAPP_STORE_PASSWORD: ${{ secrets.FAVORAPP_STORE_PASSWORD }}
          FAVORAPP_KEY_ALIAS: ${{ secrets.FAVORAPP_KEY_ALIAS }}
          FAVORAPP_KEY_PASSWORD: ${{ secrets.FAVORAPP_KEY_PASSWORD }}
        run: gradle assembleRelease -Papp.versionCode=${{ github.run_number }} -Papp.versionName=1.0.${{ github.run_number }}

      - name: Upload signed release APK
        if: ${{ secrets.FAVORAPP_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FavorApp-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
